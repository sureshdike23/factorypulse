<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>FactoryPulse V1.0 - Daily Production Reporting</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>

  <!-- Tailwind CSS Engine with FactoryPulse Precision System Theme Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-secondary-container": "#adb4ce",
            "surface-tint": "#b4c5ff",
            "on-primary-fixed": "#00174b",
            "on-tertiary": "#003914",
            "on-tertiary-fixed-variant": "#005320",
            "on-secondary": "#283044",
            "on-background": "#dce2f7",
            "on-surface-variant": "#c3c6d7",
            "primary": "#b4c5ff",
            "surface-container": "#191f2f",
            "on-secondary-fixed": "#131b2e",
            "outline-variant": "#434655",
            "on-primary-container": "#eeefff",
            "surface": "#0c1322",
            "on-surface": "#dce2f7",
            "inverse-on-surface": "#293040",
            "secondary-container": "#3f465c",
            "tertiary-container": "#007f36",
            "on-error-container": "#ffdad6",
            "background": "#0c1322",
            "surface-container-low": "#141b2b",
            "tertiary-fixed": "#7ffc97",
            "surface-bright": "#323949",
            "tertiary": "#62df7d",
            "primary-fixed-dim": "#b4c5ff",
            "error": "#ffb4ab",
            "outline": "#8d90a0",
            "secondary-fixed-dim": "#bec6e0",
            "primary-container": "#2563eb",
            "inverse-surface": "#dce2f7",
            "surface-dim": "#0c1322",
            "on-tertiary-container": "#c7ffca",
            "on-tertiary-fixed": "#002109",
            "surface-container-highest": "#2e3545",
            "error-container": "#93000a",
            "surface-container-lowest": "#070e1d",
            "on-error": "#690005",
            "secondary-fixed": "#dae2fd",
            "inverse-primary": "#0053db",
            "surface-container-high": "#232a3a",
            "secondary": "#bec6e0",
            "on-secondary-fixed-variant": "#3f465c",
            "surface-variant": "#2e3545",
            "tertiary-fixed-dim": "#62df7d",
            "on-primary": "#002a78",
            "on-primary-fixed-variant": "#003ea8",
            "primary-fixed": "#dbe1ff"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "touch-target-min": "3rem",
            "gutter-mobile": "0.75rem",
            "space-2xs": "0.125rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-xl": "2rem",
            "space-2xl": "3rem",
            "space-base": "1rem",
            "space-xs": "0.25rem",
            "gutter-desktop": "1.5rem",
            "space-lg": "1.5rem"
          },
          fontFamily: {
            "display-lg-mobile": ["Inter"],
            "mono-data-md": ["JetBrains Mono"],
            "metric-display": ["JetBrains Mono"],
            "body-sm": ["Inter"],
            "label-caps": ["JetBrains Mono"],
            "mono-data-sm": ["JetBrains Mono"],
            "headline-md": ["Inter"],
            "body-lg": ["Inter"],

            "headline-sm": ["Inter"],
            "body-md": ["Inter"],
            "display-lg": ["Inter"]
          },
          fontSize: {
            "display-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "mono-data-md": ["14px", { lineHeight: "20px", letterSpacing: "-0.01em", fontWeight: "500" }],
            "metric-display": ["28px", { lineHeight: "34px", letterSpacing: "-0.03em", fontWeight: "700" }],
            "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],

            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "headline-sm": ["18px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "display-lg": ["44px", { lineHeight: "52px", letterSpacing: "-0.025em", fontWeight: "800" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
  <div id="app" class="flex flex-col min-h-screen"></div>

  <!-- Supabase Client v2 CDN Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
